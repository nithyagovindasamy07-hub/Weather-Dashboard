
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A live weather dashboard to check temperature, humidity and wind speed of any city.">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🌦️ Weather Dashboard</h1>
    <p>Check the live weather of any city</p>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button id="searchBtn">Search</button>
    </div>

    <p id="message"></p>

    <div id="weatherResult" class="weather-card" hidden>
      <h2 id="cityName"></h2>
      <h1 id="temperature"></h1>
      <p id="condition"></p>

      <div class="weather-details">
        <div class="detail">
          <h3>💧 Humidity</h3>
          <p id="humidity"></p>
        </div>
        <div class="detail">
          <h3>💨 Wind Speed</h3>
          <p id="wind"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
